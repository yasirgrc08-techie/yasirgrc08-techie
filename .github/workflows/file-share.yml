name: file-share

on:
  push:
    paths: ['file-share/**', '.github/workflows/file-share.yml']
  pull_request:
    paths: ['file-share/**', '.github/workflows/file-share.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: file-share
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
